<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d33">
  <title>Soccer Champs Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/manager.css">
</head>
<body>
  <section id="start" hidden></section>

  <div id="shell" hidden>
    <header id="topbar"></header>
    <nav id="tabs" aria-label="Seções"></nav>
    <main id="main"></main>
  </div>

  <section id="matchday" hidden></section>
  <section id="btnmatch" hidden></section>
  <div id="modal-root" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Motor do futebol de botão (usado no modo "Jogar no botão") -->
  <script src="js/physics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/game.js"></script>
  <!-- Manager -->
  <script src="js/manager/util.js"></script>
  <script src="js/manager/data.js"></script>
  <script src="js/manager/gen.js"></script>
  <script src="js/manager/squad.js"></script>
  <script src="js/manager/engine.js"></script>
  <script src="js/manager/world.js"></script>
  <script src="js/manager/market.js"></script>
  <script src="js/manager/ui.js"></script>
  <script src="js/manager/views.js"></script>
  <script src="js/manager/live.js"></script>
  <script src="js/manager/bridge.js"></script>
</body>
</html>
